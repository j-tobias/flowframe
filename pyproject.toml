[project]
name = "flowframe"
version = "0.2.3"
description = "Webpage smooth-scroll video recorder"
readme = "README.md"
authors = [
    { name = "j-tobias", email = "justus.tobias@googlemail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.2.0",
    "playwright>=1.40.0",
    "pypdfium2>=5.9.0",
    "rich>=13.0.0",
]

[project.scripts]
flowframe = "flowframe.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"
